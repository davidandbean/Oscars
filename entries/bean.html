<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"utf-8\" />
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />
  <title>BB&D+E Oscars Bracket — Bean's Entries</title>
  <style>
    :root { color-scheme: light dark; --bg:#0a0a0a; --panel:#111317; --panel2:#171a20; --text:#f6f7fb; --muted:#aab1bc; --gold:#f5c542; --gold2:#ffdf7e; --row:#0c0f14; --border:#232832; --ok:#22c55e; --no:#ef4444; }
    @media (prefers-color-scheme: light) { :root { --bg:#faf8f2; --panel:#ffffff; --panel2:#fbfaf6; --text:#111317; --muted:#4f5966; --row:#fffdf7; --border:#ece6d8; } }
    body { margin:0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .wrap { max-width: 1000px; margin:0 auto; padding: 22px 16px 40px; }
    header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .title { font-weight:900; font-size: clamp(1.3rem, 3.6vw, 1.9rem); background: linear-gradient(90deg, var(--gold), var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .pill { padding:8px 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel); color:var(--muted); text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .board { background: var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    table { width:100%; border-collapse: collapse; }
    thead th { background: var(--panel2); text-align:left; padding: 12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; }
    tbody td { padding: 12px 14px; border-top:1px solid var(--border); }
    tbody tr:nth-child(even) td { background: var(--row); }
    .right { text-align:right; }
    .ok { color: var(--ok); font-weight:700; }
    .no { color: var(--no); font-weight:700; }
    .legend { color:var(--muted); font-size:.9rem; margin: 8px 2px 12px; }
  </style>
</head>
<body>
  <!-- Picks embedded: 24 categories -->
  <div class=\"wrap\">
    <header>
      <div class=\"title\">BB&D+E Oscars Bracket — Bean's Entries</div>
      <a class=\"pill\" href=\"https://davidandbean.github.io/Oscars/\">← Back to Leaderboard</a>
    </header>

    <div class=\"legend\">A checkmark appears next to each category when the winner is announced. Green = correct, red = incorrect.</div>

    <div class=\"board\">
      <table>
        <thead>
          <tr><th>Category</th><th>Pick</th><th>Winner (live)</th><th class=\"right\">Status</th></tr>
        </thead>
        <tbody id=\"body\"></tbody>
      </table>
    </div>
  </div>
  <script>
    const WINNERS_CSV_URL = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vRdf-pBP_AyYyPgagUN1qXI5hCTLYajF473HMQpbeTG9JDymQA970RNg-2ymgJqmw_Cj3S2w_05rSvL/pub?gid=289165013&single=true&output=csv\"; // categories expected in B1..Y1; winners in next non-empty row
    const PICKS = {"Actor in a Leading Role": "Michael B. Jordan - Sinners", "Actor in a Supporting Role": "Sean Penn - One Battle After Another", "Actress in a Leading Role": "Jessie Buckley - Hamnet", "Actress in a Supporting Role": "Teyana Taylor - One Battle After Another", "Animated Feature Film": "K-Pop Demon Hunters", "Animated Short Film": "Butterfly", "Cinematography": "Sinners", "Costume Design": "Frankenstein - Kate Hawley", "Directing": "Ryan Coogler - Sinners", "Documentary Feature Film": "The Perfect Neighbor", "Documentary Short Film": "All the Empty Rooms", "Film Editing": "One Battle After Another", "International Feature Film": "Sentimental Value", "Makeup & Hairstyling": "Frankenstein", "Music (Original Score)": "Sinners", "Music (Original Song)": "Golden - K-Pop Demon Hunters", "Best Picture": "One Battle After Another", "Production Design": "Frankenstein", "Live Action Short Film": "Two People Exchanging Saliva", "Sound": "F1", "Visual Effects": "Avatar: Fire and Ash", "Writing (Adapted Screenplay)": "One Battle After Another", "Writing (Original Screenplay)": "Sinners", "Casting": "Sinners - Francine Maisler"};

    function parseCSV(text){const rows=[];let cur=[],cell=\"\",inQ=false,i=0;while(i<text.length){const c=text[i];if(c=='\"'){if(inQ&&text[i+1]=='\"'){cell+='\"';i+=2;continue;} inQ=!inQ;i++;continue;} if(!inQ&&(c==','||c=='\n'||c=='\r')){cur.push(cell);cell=\"\"; if(c==','){i++;continue;} if(c=='\r'&&text[i+1]=='\n')i++; i++; rows.push(cur);cur=[];continue;} cell+=c;i++;} cur.push(cell); if(cur.some(x=>String(x).trim()!=\"\")) rows.push(cur); return rows;}

    // Winners sheet: treat first non-empty row as headers; ignore column A; categories = B1..; winners row = first subsequent row with any non-empty in B..; use last non-empty row if multiple.
    function extractWinners(rows){ if(!rows.length) return {}; let headers=null; for(let r=0;r<rows.length;r++){const line=rows[r]; if(line.some(x=>String(x).trim()!="")){ headers=line; // assume this is header row
        // find first row after with data
        let dataRows=[]; for(let k=r+1;k<rows.length;k++){ const ln=rows[k]; if(ln.some(x=>String(x).trim()!="")) dataRows.push(ln); }
        if(!dataRows.length) return {}; const winnersRow=dataRows[dataRows.length-1]; // take last non-empty row
        const map={}; for(let c=1;c<Math.max(headers.length, winnersRow.length);c++){ const cat=String(headers[c]||'').trim(); const win=String(winnersRow[c]||'').trim(); if(cat && win) map[normalize(cat)]=win; }
        return map; }
      }
      return {}; }

    function normalize(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}

    async function refresh(){
      try{
        const text = await fetch(WINNERS_CSV_URL,{cache:'no-store'}).then(r=>r.text());
        const rows = parseCSV(text);
        const winMap = extractWinners(rows);
        render(winMap);
      }catch(e){ console.error(e); document.getElementById('body').innerHTML='<tr><td colspan=4>Failed to load winners. Please refresh.</td></tr>'; }
    }

    function render(winMap){
      const body=document.getElementById('body'); body.innerHTML='';
      const cats = Object.keys(PICKS);
      let correct=0; for(const cat of cats){ const pick=PICKS[cat]||''; const winner = winMap[normalize(cat)]||''; const decided = !!winner; const ok = decided && normalize(pick)===normalize(winner); if(ok) correct++; const status = decided ? (ok? '✅ Correct' : '❌ Incorrect') : '—'; const cls = decided ? (ok? 'ok' : 'no') : '';
        const tr=document.createElement('tr'); tr.innerHTML = `<td>${cat}</td><td class="name">${pick?pick.replace(/&/g,'&amp;').replace(/</g,'&lt;'):''}</td><td>${winner?winner.replace(/&/g,'&amp;').replace(/</g,'&lt;'):''}</td><td class="right ${cls}">${status}</td>`; body.appendChild(tr);
      }
      const tr=document.createElement('tr'); tr.innerHTML = `<td><strong>Total Correct</strong></td><td></td><td></td><td class="right"><strong>${correct}</strong></td>`; body.appendChild(tr);
    }

    refresh();
  </script>
</body>
</html>
