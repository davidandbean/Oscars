<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"utf-8\" />
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />
  <title>BB&D+E Oscars Bracket — David's Entries</title>
  <style>
    :root { color-scheme: light dark; --bg:#0a0a0a; --panel:#111317; --panel2:#171a20; --text:#f6f7fb; --muted:#aab1bc; --gold:#f5c542; --gold2:#ffdf7e; --row:#0c0f14; --border:#232832; --ok:#22c55e; --no:#ef4444; }
    @media (prefers-color-scheme: light) { :root { --bg:#faf8f2; --panel:#ffffff; --panel2:#fbfaf6; --text:#111317; --muted:#4f5966; --row:#fffdf7; --border:#ece6d8; } }
    body { margin:0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    .wrap { max-width: 1000px; margin:0 auto; padding: 22px 16px 40px; }
    header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .title { font-weight:900; font-size: clamp(1.3rem, 3.6vw, 1.9rem); background: linear-gradient(90deg, var(--gold), var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .pill { padding:8px 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel); color:var(--muted); text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .board { background: var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    table { width:100%; border-collapse: collapse; }
    thead th { background: var(--panel2); text-align:left; padding: 12px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; }
    tbody td { padding: 12px 14px; border-top:1px solid var(--border); }
    tbody tr:nth-child(even) td { background: var(--row); }
    .right { text-align:right; }
    .ok { color: var(--ok); font-weight:700; }
    .no { color: var(--no); font-weight:700; }
    .legend { color:var(--muted); font-size:.9rem; margin: 8px 2px 12px; }
  </style>
</head>
<body>
  <!-- Embedded categories: 24 -->
  <div class=\"wrap\">
    <header>
      <div class=\"title\">BB&D+E Oscars Bracket — David's Entries</div>
      <a class=\"pill\" href=\"https://davidandbean.github.io/Oscars/\">← Back to Leaderboard</a>
    </header>

    <div class=\"legend\">A checkmark appears next to each category when the winner is announced. Green = correct, red = incorrect.</div>

    <div class=\"board\">
      <table>
        <thead>
          <tr><th>Category</th><th>Pick</th><th>Winner (live)</th><th class=\"right\">Status</th></tr>
        </thead>
        <tbody id=\"body\"></tbody>
      </table>
    </div>
  </div>
  <script>
    const CSV_URL = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vRdf-pBP_AyYyPgagUN1qXI5hCTLYajF473HMQpbeTG9JDymQA970RNg-2ymgJqmw_Cj3S2w_05rSvL/pub?gid=579714765&single=true&output=csv\";
    const PICKS = {"Actor in a Leading Role": "Michael B. Jordan - Sinners", "Actor in a Supporting Role": "Sean Penn - One Battle After Another", "Actress in a Leading Role": "Jessie Buckley - Hamnet", "Actress in a Supporting Role": "Amy Madigan - Weapons", "Animated Feature Film": "K-Pop Demon Hunters", "Animated Short Film": "Butterfly", "Cinematography": "One Battle After Another", "Costume Design": "Frankenstein - Kate Hawley", "Directing": "Paul Anderson - One Battle After Another", "Documentary Feature Film": "The Perfect Neighbor", "Documentary Short Film": "All the Empty Rooms", "Film Editing": "One Battle After Another", "International Feature Film": "Sentimental Value", "Makeup & Hairstyling": "Frankenstein", "Music (Original Score)": "Sinners", "Music (Original Song)": "Golden - K-Pop Demon Hunters", "Best Picture": "One Battle After Another", "Production Design": "Frankenstein", "Live Action Short Film": "Two People Exchanging Saliva", "Sound": "F1", "Visual Effects": "Avatar: Fire and Ash", "Writing (Adapted Screenplay)": "One Battle After Another", "Writing (Original Screenplay)": "Sinners", "Casting": "Sinners - Francine Maisler"};
    function parseCSV(text){const rows=[];let cur=[],cell=\"\",inQ=false,i=0;while(i<text.length){const c=text[i];if(c=='\"'){if(inQ&&text[i+1]=='\"'){cell+='\"';i+=2;continue;} inQ=!inQ;i++;continue;} if(!inQ&&(c==','||c=='\n'||c=='\r')){cur.push(cell);cell=\"\"; if(c==','){i++;continue;} if(c=='\r'&&text[i+1]=='\n')i++; i++; rows.push(cur);cur=[];continue;} cell+=c;i++;} cur.push(cell); if(cur.some(x=>String(x).trim()!=\"\")) rows.push(cur); return rows;}
    const toLower=a=>a.map(x=>String(x||\"\").trim().toLowerCase());
    function isSectionTitleRow(c){const n=c.filter(x=>String(x).trim()!=\"\"); if(n.length!=1)return false; const only=String(n[0]).trim().toLowerCase(); return /^oscar\s*winners?$/.test(only)||/(tiebreaker|tie\s*breaker|bracket).*(score|scores)/.test(only);}
    function splitAllTables(rows){const hidx=[]; for(let i=0;i<rows.length;i++){const r=rows[i]; if(!r||r.every(c=>String(c).trim()==\"\"))continue; const l=toLower(r); if((l.includes('contestant')&&(l.includes('score')||l.includes('points'))) || (l.includes('category')&&l.includes('winner'))) hidx.push(i);} if(!hidx.length) return []; const sidx=[]; for(let i=0;i<rows.length;i++) if(isSectionTitleRow(rows[i])) sidx.push(i); const out=[]; for(let h=0;h<hidx.length;h++){const start=hidx[h]; const nextH=hidx[h+1]??rows.length; const nextS=sidx.find(ix=>ix>start)??rows.length; const end=Math.min(nextH,nextS); out.push({header:rows[start], body:rows.slice(start+1,end)});} return out;}
    function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'').trim();}
    async function loadWinners(){const text=await fetch(CSV_URL,{cache:'no-store'}).then(r=>r.text()); const rows=parseCSV(text); const tables=splitAllTables(rows); let winners=[]; for(const t of tables){const h=t.header.map(x=>String(x||'').trim()); const low=toLower(h); if(low.includes('category')&&low.includes('winner')){const ic=h.findIndex(x=>/^\s*category\s*$/i.test(x)); const iw=h.findIndex(x=>/^\s*winner\s*$/i.test(x)); const inote=h.findIndex(x=>/^\s*notes?\s*$/i.test(x)); for(const r of t.body){const cat=String(r[ic]||'').trim(); const win=String(r[iw]||'').trim(); if(cat&&win) winners.push({category:cat, winner:win, notes: inote>=0?String(r[inote]||'').trim():''});}} } return winners;}
    function render(winners){const body=document.getElementById('body'); body.innerHTML=''; const map=Object.create(null); for(const w of winners) map[norm(w.category)]=w; const cats=Object.keys(PICKS); let correct=0; for(const cat of cats){const pick=PICKS[cat]||''; const w=map[norm(cat)]; const win=w?w.winner:''; const decided=!!win; const isOk=decided && norm(pick)===norm(win); if(isOk) correct++; const status=decided?(isOk?'✅ Correct':'❌ Incorrect'):'—'; const cls=decided?(isOk?'ok':'no'):''; const tr=document.createElement('tr'); tr.innerHTML=`<td>${cat}</td><td class="name">${pick?pick.replace(/&/g,'&amp;').replace(/</g,'&lt;'):''}</td><td>${win?win.replace(/&/g,'&amp;').replace(/</g,'&lt;'):''}</td><td class="right ${cls}">${status}</td>`; body.appendChild(tr);} const tr = document.createElement('tr'); tr.innerHTML = `<td><strong>Total Correct</strong></td><td></td><td></td><td class="right"><strong>${correct}</strong></td>`; body.appendChild(tr);} 
    (async()=>{try{const w=await loadWinners(); render(w);}catch(e){console.error(e); document.getElementById('body').innerHTML='<tr><td colspan="4">Failed to load winners. Please refresh.</td></tr>';}})();
  </script>
</body>
</html>
